<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{
  --bg:#0f1a24; --panel:#152431; --panel2:#1b2e3e; --line:#26394a;
  --text:#e8eef3; --muted:#8aa0b2;
  --good:#3ddc97; --fair:#f5c542; --poor:#ff8a3d; --bad:#ff4d5e;
  --sans:"Barlow",system-ui,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2f5; --panel:#ffffff; --panel2:#f5f8fa; --line:#d6dee5;
  --text:#102030; --muted:#5a6d7d; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(0,30vh);gap:1.4vmin;padding:1.6vmin}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}

/* Status band */
#band{display:flex;align-items:center;gap:2.4vmin;padding:1.6vmin 2.4vmin;border-radius:1.2vmin;background:var(--st,var(--muted));color:#06121b;transition:background .4s}
#stateWord{font-family:var(--cond);font-weight:700;font-size:7vmin;line-height:1}
#stateWhy{font-size:2.2vmin;font-weight:500;opacity:.85}
#bandRight{margin-left:auto;text-align:right}
#playerName{font-family:var(--cond);font-weight:700;font-size:3.4vmin;line-height:1.1}
#clock{font-size:2.2vmin;font-weight:500}

/* Target cards */
#targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(26vmin,1fr));gap:1.4vmin}
.card{background:var(--panel);border-radius:1vmin;padding:1.4vmin 1.8vmin;border-left:.6vmin solid var(--c)}
.card h2{font-size:2vmin;font-weight:600;display:flex;justify-content:space-between;gap:1vmin}
.card h2 span{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:6vmin;font-weight:700;line-height:1.05}
.big small{font-size:2.4vmin;color:var(--muted);font-weight:500;margin-left:.4vmin}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.6vmin;margin-top:.4vmin}
.stats div{font-size:1.5vmin;color:var(--muted)}
.stats b{display:block;font-family:var(--cond);font-size:2.4vmin;font-weight:500;color:var(--text)}
.fail .big{color:var(--bad)}

/* Chart */
#chartWrap{background:var(--panel);border-radius:1vmin;padding:1.2vmin;min-height:0;display:flex;flex-direction:column}
#chartHead{display:flex;justify-content:space-between;font-size:1.8vmin;color:var(--muted);padding:0 .6vmin .6vmin}
#chart{flex:1;width:100%;min-height:0;display:block}

/* Bottom */
#bottom{display:grid;grid-template-columns:1fr 1.3fr;gap:1.4vmin;min-height:0}
.panel{background:var(--panel);border-radius:1vmin;padding:1.4vmin 1.8vmin;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.panel h3{font-size:1.8vmin;color:var(--muted);font-weight:500;margin-bottom:.8vmin}
#info{display:grid;grid-template-columns:auto 1fr;gap:.5vmin 2vmin;font-size:1.9vmin;overflow:auto}
#info dt{color:var(--muted)}
#info dd{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log{list-style:none;font-size:1.8vmin;overflow:auto}
#log li{display:grid;grid-template-columns:auto auto 1fr;gap:1.2vmin;padding:.45vmin 0;border-bottom:1px solid var(--line);align-items:center}
#log time{color:var(--muted);font-variant-numeric:tabular-nums}
#log i{width:1.2vmin;height:1.2vmin;border-radius:50%;background:var(--d)}
#log .empty{display:block;color:var(--muted);border:0}

@media (max-width:820px),(orientation:portrait){
  html,body{overflow:auto;height:auto}
  body{grid-template-rows:auto;font-size:15px}
  #stateWord{font-size:44px} #stateWhy,#clock{font-size:14px} #playerName{font-size:20px}
  #targets{grid-template-columns:1fr}
  .card h2{font-size:15px} .big{font-size:40px} .big small{font-size:16px}
  .stats div{font-size:11px} .stats b{font-size:17px}
  #chartWrap{height:300px} #chartHead,.panel h3{font-size:13px}
  #bottom{grid-template-columns:1fr} #info,#log{font-size:14px}
  #log i{width:9px;height:9px}
}
@media (prefers-reduced-motion:reduce){#band{transition:none}}
</style>
</head>
<body>
<header id="band">
  <div>
    <div id="stateWord">Starting…</div>
    <div id="stateWhy">Warming up connections</div>
  </div>
  <div id="bandRight">
    <div id="playerName"></div>
    <div id="clock" class="num"></div>
  </div>
</header>

<section id="targets"></section>

<section id="chartWrap">
  <div id="chartHead"><span>Latency history</span><span id="chartRange"></span></div>
  <canvas id="chart"></canvas>
</section>

<section id="bottom">
  <div class="panel">
    <h3>This player</h3>
    <dl id="info"></dl>
  </div>
  <div class="panel">
    <h3>Events</h3>
    <ul id="log"><li class="empty">No events yet. Drops, recoveries and speed tests show up here.</li></ul>
  </div>
</section>

<script>
/* ---------- Config via URL ----------
  ?name=Lobby%20X5M         label shown top-right
  &interval=2000            ms between pings (min 500)
  &timeout=3000             ms before a ping counts as lost
  &window=300               samples kept on the graph
  &speed=300                seconds between download tests (0 = off)
  &speedmb=5                download test size in MB
  &targets=Google|https://www.google.com/generate_204,Router|https://...
  &theme=light
*/
const P = new URLSearchParams(location.search);
if (P.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
const NAME = P.get('name') || '';
const INTERVAL = Math.max(500, +P.get('interval') || 2000);
const TIMEOUT = Math.max(300, +P.get('timeout') || 3000);
const WINDOW = Math.min(3000, Math.max(30, +P.get('window') || 300));
const SPEED_EVERY = P.has('speed') ? Math.max(0, +P.get('speed')) : 300;
const SPEED_BYTES = Math.round((+P.get('speedmb') || 5) * 1e6);

const COLORS = ['#5cc8ff','#b58cff','#ff7ab6','#3ddc97','#f5c542','#ff8a3d'];
const DEFAULT_TARGETS = [
  {name:'Google',     url:'https://www.google.com/generate_204'},
  {name:'Cloudflare', url:'https://1.1.1.1/cdn-cgi/trace'},
  {name:'OptiSigns',  url:'https://app.optisigns.com/', method:'HEAD'}
];
function parseTargets(){
  const raw = P.get('targets'); if (!raw) return DEFAULT_TARGETS;
  return raw.split(',').map(s => s.trim()).filter(Boolean).map(s => {
    const [a,b] = s.includes('|') ? s.split('|') : [null, s];
    let host = b; try { host = new URL(b).hostname; } catch(e){}
    return {name: a || host, url: b};
  });
}
const targets = parseTargets().slice(0,6).map((t,i) => ({
  ...t, method: t.method || 'GET', color: COLORS[i % COLORS.length],
  hist: [], sent: 0, lost: 0, last: null
}));
const okHist = [];          // per tick: fraction of targets that answered
const startedAt = Date.now();
let ticksTotal = 0, ticksUp = 0;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const push = (arr, v, max = WINDOW) => { arr.push(v); if (arr.length > max) arr.shift(); };
const pad = n => String(n).padStart(2,'0');
const hms = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function fmtDur(ms){
  const s = Math.round(ms/1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d) return `${d}d ${h%24}h`;
  if (h) return `${h}h ${m%60}m`;
  return `${m}m ${s%60}s`;
}
function stats(arr){
  const v = arr.filter(x => x != null);
  if (!v.length) return {avg:null,min:null,max:null,jit:null,loss: arr.length ? 1 : 0};
  let sum = 0, min = Infinity, max = 0, jsum = 0, jn = 0;
  for (let i = 0; i < arr.length; i++){
    const x = arr[i]; if (x == null) continue;
    sum += x; if (x < min) min = x; if (x > max) max = x;
    if (i && arr[i-1] != null){ jsum += Math.abs(x - arr[i-1]); jn++; }
  }
  return {avg: sum/v.length, min, max, jit: jn ? jsum/jn : 0, loss: 1 - v.length/arr.length};
}
const ms = x => x == null ? '–' : Math.round(x);

/* ---------- Ping ----------
  Browsers can't send ICMP, so each "ping" is a tiny HTTPS request with a
  cache-buster. After the first request the connection is reused, so the
  time is close to a real round trip. */
async function ping(t){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
  const u = t.url + (t.url.includes('?') ? '&' : '?') + '_=' + Date.now() + Math.random().toString(36).slice(2,6);
  const s = performance.now();
  try {
    await fetch(u, {mode:'no-cors', cache:'no-store', method:t.method, signal:ctrl.signal, credentials:'omit'});
    return performance.now() - s;
  } catch(e){ return null; }
  finally { clearTimeout(timer); }
}

/* ---------- Status ---------- */
const STATE = {
  GOOD:    {word:'Connection good', c:'var(--good)'},
  FAIR:    {word:'Connection fair', c:'var(--fair)'},
  POOR:    {word:'Connection poor', c:'var(--poor)'},
  OFFLINE: {word:'No internet',     c:'var(--bad)'}
};
let status = null, candidate = null, candidateCount = 0, statusSince = Date.now();
let outageStart = null, outages = 0, downtime = 0;

function evaluate(okNow){
  if (okNow === 0) return {s:'OFFLINE', why:'None of the test servers are answering'};
  const n = Math.min(15, okHist.length);
  let loss = 0; for (let i = 0; i < n; i++) loss += 1 - okHist[okHist.length-1-i];
  loss = n ? loss/n : 0;
  const recent = targets.map(t => stats(t.hist.slice(-15)));
  const lats = recent.map(r => r.avg).filter(x => x != null).sort((a,b) => a-b);
  const lat = lats.length ? lats[Math.floor(lats.length/2)] : 0;
  const jit = Math.max(0, ...recent.map(r => r.jit || 0));
  const why = `${Math.round(lat)} ms latency, ${(loss*100).toFixed(loss < .1 ? 1 : 0)}% loss, ${Math.round(jit)} ms jitter (last 30 s)`;
  if (loss > .10 || lat > 400 || jit > 150) return {s:'POOR', why};
  if (loss > .02 || lat > 150 || jit > 50)  return {s:'FAIR', why};
  return {s:'GOOD', why};
}

function applyStatus(ev){
  const now = Date.now();
  // Offline/back-online switch instantly; quality changes need 3 ticks in a row
  if (ev.s !== status){
    const instant = ev.s === 'OFFLINE' || status === 'OFFLINE' || status === null;
    if (candidate === ev.s) candidateCount++; else { candidate = ev.s; candidateCount = 1; }
    if (instant || candidateCount >= 3){
      if (ev.s === 'OFFLINE'){ outageStart = now; logEvent('bad', 'Internet lost'); }
      else if (status === 'OFFLINE'){
        const d = now - outageStart; outages++; downtime += d; outageStart = null;
        logEvent('good', `Internet back after ${fmtDur(d)}`);
      } else if (status !== null){
        logEvent(ev.s === 'GOOD' ? 'good' : ev.s === 'FAIR' ? 'fair' : 'poor', `${STATE[status].word} → ${STATE[ev.s].word.toLowerCase()}`);
      }
      status = ev.s; statusSince = now; candidate = null;
    }
  } else candidate = null;
  const st = STATE[status];
  $('band').style.setProperty('--st', st.c);
  $('stateWord').textContent = st.word;
  $('stateWhy').textContent = status === 'OFFLINE' ? `Down for ${fmtDur(now - outageStart)}` : ev.why;
}

/* ---------- Event log ---------- */
const events = [];
function logEvent(kind, text){
  events.unshift({t:new Date(), kind, text}); if (events.length > 100) events.pop();
  const col = {good:'var(--good)', fair:'var(--fair)', poor:'var(--poor)', bad:'var(--bad)', info:'var(--muted)'}[kind];
  const li = document.createElement('li');
  li.innerHTML = `<time></time><i style="--d:${col}"></i><span></span>`;
  li.querySelector('time').textContent = hms(events[0].t);
  li.querySelector('span').textContent = text;
  const log = $('log'); const empty = log.querySelector('.empty'); if (empty) empty.remove();
  log.prepend(li); while (log.children.length > 100) log.lastChild.remove();
}
addEventListener('offline', () => logEvent('bad', 'Device reports network adapter offline'));
addEventListener('online',  () => logEvent('info', 'Device reports network adapter online'));

/* ---------- Cards ---------- */
function buildCards(){
  const wrap = $('targets');
  targets.forEach(t => {
    let host = t.url; try { host = new URL(t.url).hostname; } catch(e){}
    const el = document.createElement('div'); el.className = 'card'; el.style.setProperty('--c', t.color);
    el.innerHTML = `<h2>${''}<em></em><span></span></h2>
      <div class="big num"><b>–</b><small>ms</small></div>
      <div class="stats">
        <div>Avg<b>–</b></div><div>Min<b>–</b></div><div>Max<b>–</b></div><div>Jitter<b>–</b></div><div>Loss<b>–</b></div>
      </div>`;
    el.querySelector('em').textContent = t.name; el.querySelector('em').style.fontStyle = 'normal';
    el.querySelector('span').textContent = host;
    t.el = el; t.bigEl = el.querySelector('.big b'); t.statEls = el.querySelectorAll('.stats b');
    wrap.appendChild(el);
  });
}
function renderCards(){
  targets.forEach(t => {
    const s = stats(t.hist);
    t.el.classList.toggle('fail', t.last == null);
    t.bigEl.textContent = t.last == null ? 'Lost' : Math.round(t.last);
    t.el.querySelector('.big small').style.display = t.last == null ? 'none' : '';
    const v = [ms(s.avg), ms(s.min), ms(s.max), ms(s.jit), (s.loss*100).toFixed(s.loss && s.loss < .1 ? 1 : 0) + '%'];
    t.statEls.forEach((b,i) => b.textContent = v[i]);
  });
}

/* ---------- Chart ---------- */
const canvas = $('chart');
function niceMax(v){ for (const s of [50,100,150,200,300,500,750,1000,1500,2000,3000,5000]) if (v <= s) return s; return Math.ceil(v/1000)*1000; }
function drawChart(){
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const fs = Math.max(11, Math.min(w,h) * 0.055);
  ctx.font = `500 ${fs}px ${C('--cond')}`;
  const padL = fs*3, padR = 8, padT = 6, stripH = Math.max(6, fs*.6), padB = fs*1.6 + stripH + 6;
  const pw = w - padL - padR, ph = h - padT - padB;

  const all = []; targets.forEach(t => t.hist.forEach(v => v != null && all.push(v)));
  all.sort((a,b) => a-b);
  const ymax = niceMax(Math.max(50, (all.length ? all[Math.floor(all.length*.95)] : 50) * 1.25));
  const y = v => padT + ph - Math.min(v, ymax)/ymax * ph;
  const x = i => padL + (i / (WINDOW-1)) * pw;

  // grid
  ctx.strokeStyle = C('--line'); ctx.fillStyle = C('--muted'); ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++){
    const v = ymax*k/4, yy = Math.round(y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL+pw, yy); ctx.stroke();
    ctx.fillText(Math.round(v) + ' ms', padL - 6, yy);
  }
  // time labels
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const span = WINDOW * INTERVAL;
  for (let k = 0; k <= 4; k++){
    const ago = span * (1 - k/4);
    ctx.fillText(k === 4 ? 'now' : '-' + fmtDur(ago), padL + pw*k/4, padT + ph + stripH + 10);
  }
  // availability strip
  const off = WINDOW - okHist.length, bw = pw / WINDOW;
  okHist.forEach((r,i) => {
    ctx.fillStyle = r === 1 ? C('--good') : r > 0 ? C('--fair') : C('--bad');
    ctx.fillRect(x(off+i) - bw/2, padT + ph + 4, Math.max(1, bw), stripH);
  });
  // lines
  ctx.lineWidth = Math.max(1.5, fs*.12); ctx.lineJoin = 'round';
  targets.forEach(t => {
    const o = WINDOW - t.hist.length; ctx.strokeStyle = t.color; ctx.beginPath();
    let pen = false;
    t.hist.forEach((v,i) => {
      if (v == null){ pen = false; return; }
      const X = x(o+i), Y = y(v);
      pen ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y); pen = true;
    });
    ctx.stroke();
    // lost samples as markers at the top
    ctx.fillStyle = C('--bad');
    t.hist.forEach((v,i) => { if (v == null) ctx.fillRect(x(o+i) - 1.5, padT, 3, fs*.5); });
  });
  $('chartRange').textContent = `Last ${fmtDur(span)} · every ${INTERVAL/1000}s · bar = availability`;
}
new ResizeObserver(drawChart).observe(canvas);

/* ---------- Speed test ---------- */
let lastSpeed = null, speedRunning = false;
async function speedTest(){
  if (speedRunning || status === 'OFFLINE') return;
  speedRunning = true; renderInfo();
  const url = `https://speed.cloudflare.com/__down?bytes=${SPEED_BYTES}&_=${Date.now()}`;
  let mbps = null;
  try {
    const s = performance.now();
    const r = await fetch(url, {cache:'no-store'});
    const b = await r.arrayBuffer();
    mbps = b.byteLength * 8 / ((performance.now() - s)/1000) / 1e6;
  } catch(e){
    // Fallback if the CORS read is blocked: time the opaque download via Resource Timing
    try {
      performance.clearResourceTimings();
      const u2 = url + 'b';
      fetch(u2, {mode:'no-cors', cache:'no-store'}).catch(()=>{});
      for (let i = 0; i < 240 && mbps == null; i++){
        await sleep(250);
        const en = performance.getEntriesByName(u2)[0];
        if (en && en.responseEnd > 0 && en.duration > 0) mbps = SPEED_BYTES * 8 / (en.duration/1000) / 1e6;
      }
    } catch(e2){}
  }
  speedRunning = false;
  if (mbps != null){
    lastSpeed = {mbps, t:new Date()};
    logEvent('info', `Download test: ${mbps.toFixed(1)} Mbps (${SPEED_BYTES/1e6} MB)`);
  } else logEvent('poor', 'Download test failed');
  renderInfo();
}

/* ---------- Info panel ---------- */
let publicIP = '…';
async function fetchIP(){
  try { const r = await fetch('https://api.ipify.org?format=json', {cache:'no-store'}); publicIP = (await r.json()).ip; }
  catch(e){ if (publicIP === '…') publicIP = 'Unavailable'; }
}
function renderInfo(){
  const now = Date.now(), c = navigator.connection;
  const curDown = outageStart ? now - outageStart : 0;
  const rows = [
    ['Status for', status ? fmtDur(now - statusSince) : '–'],
    ['Availability', ticksTotal ? (ticksUp/ticksTotal*100).toFixed(2) + '%' : '–'],
    ['Outages', `${outages + (outageStart ? 1 : 0)} · ${fmtDur(downtime + curDown)} total down`],
    ['Download', speedRunning ? 'Testing…' : lastSpeed ? `${lastSpeed.mbps.toFixed(1)} Mbps at ${hms(lastSpeed.t)}` : (SPEED_EVERY ? 'Pending' : 'Off')],
    ['Public IP', publicIP],
    ['Link (browser)', c ? `${c.type && c.type !== 'unknown' ? c.type + ', ' : ''}${c.effectiveType || '?'}, ~${c.downlink ?? '?'} Mbps, ~${c.rtt ?? '?'} ms` : 'Not reported'],
    ['Screen', `${screen.width}×${screen.height} @${devicePixelRatio}x`],
    ['Monitoring', `${fmtDur(now - startedAt)} since ${hms(new Date(startedAt))}`],
  ];
  $('info').innerHTML = '';
  rows.forEach(([k,v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; dd.title = v; $('info').append(dt, dd);
  });
}

/* ---------- Main loop ---------- */
async function tick(){
  const res = await Promise.all(targets.map(ping));
  let ok = 0;
  res.forEach((v,i) => { const t = targets[i]; t.sent++; t.last = v; if (v == null) t.lost++; else ok++; push(t.hist, v); });
  push(okHist, ok / targets.length);
  ticksTotal++; if (ok) ticksUp++;
  applyStatus(evaluate(ok));
  renderCards(); drawChart();
}
async function main(){
  $('playerName').textContent = NAME || (navigator.userAgent.match(/\(([^;)]+;[^;)]+)/)?.[1] ?? 'This device');
  buildCards(); renderInfo();
  setInterval(() => { $('clock').textContent = new Date().toLocaleString(); renderInfo(); }, 1000);
  fetchIP(); setInterval(fetchIP, 10*60*1000);
  await Promise.all(targets.map(ping));            // warm-up: DNS + TLS, not counted
  if (SPEED_EVERY){ setTimeout(speedTest, 15000); setInterval(speedTest, SPEED_EVERY*1000); }
  while (true){
    const s = Date.now();
    await tick();
    await sleep(Math.max(0, INTERVAL - (Date.now() - s)));
  }
}
main();
</script>
</body>
</html>
